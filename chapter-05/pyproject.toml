[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ch5mprrab"
version = "1.0.0"
description = "Chapter 5 simulations: MPR-RAB, multi-primary robust adaptive beamforming with subspace tracking, and its comparators"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Ayman Elnashar"}]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
notebook = ["jupyter", "nbformat", "nbconvert"]
test = ["pytest"]

[tool.setuptools]
packages = ["ch5mprrab", "ch5mprrab.experiments"]

[tool.setuptools.package-data]
ch5mprrab = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
