[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ch8wrab"
version = "1.0.0"
description = "Chapter 8 simulations: wideband robust adaptive beamforming (WRAB) for sub-terahertz 6G links with per-subcarrier worst-case constraints, exact projection and covariance-anchored margins"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Ayman Elnashar"}]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "cvxpy>=1.4",
    "clarabel>=0.6",
    "threadpoolctl>=3.1",
]

[project.optional-dependencies]
fast = ["numba>=0.58"]
notebook = ["jupyter", "nbformat", "nbconvert"]
test = ["pytest"]

[tool.setuptools]
packages = ["ch8wrab"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
